spring.application.name=Quotation

# Loads secrets/config from a .env file in the working directory (project root).
# "optional:" means the app still starts normally if the file is missing (defaults below are used).
spring.config.import=optional:file:.env[.properties]

# ============================================================
# Solar CRM - Quotation backend
# ============================================================

server.port=8091

# Behind nginx / a load balancer: let Tomcat resolve the REAL client address (used for rate limiting and audit).
# Enable these two in production and list only your proxy's address range.
# server.forward-headers-strategy=native
# server.tomcat.remoteip.internal-proxies=10\\.\\d+\\.\\d+\\.\\d+

# ---- MySQL ----
# The database is created automatically (createDatabaseIfNotExist=true).
spring.datasource.url=jdbc:mysql://localhost:3306/solar_crm?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Hibernate creates and updates the tables from the entities on startup.
# Production: switch to "validate" (or Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# data.sql seeds roles, modules, permissions and the PLATFORM tenant (NO users).
# The first Super Admin is created by AdminBootstrapRunner from BOOTSTRAP_ADMIN_* (see .env.example).
# It runs on every start and is written to be idempotent (see the comments inside data.sql).
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ---- JWT ----
# These names are the ones JwtUtil reads (@Value("${sqms.jwt.secret}") and ${sqms.jwt.access-token-minutes}).
#
# LOCAL DEVELOPMENT FIX: the secret is written directly here. The old form ${JWT_SECRET:...} gives an EMPTY
# secret when JWT_SECRET exists anywhere (.env line "JWT_SECRET=", IntelliJ run configuration, Windows
# environment variable) with no value, because the default is only used when the variable is not defined at all.
#
# BEFORE PRODUCTION: go back to  sqms.jwt.secret=${JWT_SECRET}  and set JWT_SECRET (48+ random characters)
# as a real environment variable. With SPRING_PROFILES_ACTIVE=prod the application REFUSES to start on this
# development value (SecurityStartupValidator).
sqms.jwt.secret=solar-crm-dev-only-secret-key-please-change-me-before-prod-0123456789
sqms.jwt.access-token-minutes=10
sqms.jwt.refresh-token-days=7
sqms.jwt.refresh-token-days-remember-me=30

# ---- Login throttling / lockout (counters live in MySQL, shared by every instance) ----
app.security.login.max-failures-per-user=5
app.security.login.max-failures-per-ip=20
app.security.login.window-minutes=15
app.security.login.lock-minutes=15
app.security.reset.max-requests-per-ip-hour=10

# ---- CORS ----
# Comma separated frontend origins, for example http://localhost:5500,http://127.0.0.1:5500
# * is fine for local development only (prod refuses to start with *).
app.cors.allowed-origins=*



# ---- File uploads (see FILES.md) ----
# Where uploaded images live: OUTSIDE the web root and the classpath, on a volume that survives redeploys.
# Layout: {dir}/{partnerId}/{branding|users}/{uuid}.{png|jpg|webp}. With SPRING_PROFILES_ACTIVE=prod this must be an
# ABSOLUTE path (the application refuses to start otherwise). Files are served only by GET /api/files/** (token + own partner).
app.file.storage-dir=${FILE_STORAGE_PATH:./uploads}
# Largest accepted image in bytes (default 2 MB). Keep the two multipart limits in line with it: the request limit needs
# a little room for the form fields around the file.
app.file.max-bytes=${FILE_MAX_BYTES:2097152}
spring.servlet.multipart.max-file-size=${FILE_MAX_BYTES:2097152}B
spring.servlet.multipart.max-request-size=${FILE_MAX_REQUEST_BYTES:3145728}B

# ---- Mail (Gmail SMTP shown; any SMTP works) ----
# Gmail: turn on 2-Step Verification, then create an "App password" (Google Account > Security > App passwords)
# and use that 16-character value as MAIL_PASSWORD. Your normal Gmail password will NOT work.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Sender address. With Gmail it must be the same account as MAIL_USERNAME (or a verified alias).
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# Optional: used only when no logo has been uploaded in Settings > Branding. PNG or JPG recommended
# (WebP is not shown by Outlook desktop). Example: ./uploads/branding/logo.png
app.mail.logo-file=

# DEV ONLY: when MAIL_USERNAME is empty, print the reset link in the server log instead of e-mailing it.
# OFF by default now. To use it locally put MAIL_DEV_LOG_LINK=true in your own .env.
# A reset link is a password: prod refuses to start when this is true.
app.mail.dev-log-link=${MAIL_DEV_LOG_LINK:false}

# ---- Password reset ----
# Address of the FRONTEND (where login.html and reset-password.html are served). No trailing slash.
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5501}
app.password-reset.expiry-minutes=15

# Reports: largest export (rows) one request may produce. Above it the export is refused (EXPORT_TOO_LARGE), never cut short.
# Hard ceiling is 10000 (ExcelExportUtil / PdfExportUtil).
app.export.max-rows=${EXPORT_MAX_ROWS:5000}

# ---- Approval (see ApprovalGuard) ----
approval.self-approval-allowed=false

# ---- Notifications (all [NOTIFY] log lines; every value below is the built-in default) ----
# Startup step that makes notification.channel_partner_id NOT NULL and realigns old rows (V101 script = manual twin).
app.notifications.migrate-on-startup=true
# Nightly cleanup (server time Asia/Kolkata): hard-deletes rows older than retention-days (minimum 7), PER PARTNER,
# in batches. A partner that still has old rows after max-batches-per-partner is finished by the next run.
app.notifications.retention-days=90
app.notifications.cleanup-cron=0 30 2 * * *
app.notifications.cleanup-batch-size=500
app.notifications.cleanup-max-batches-per-partner=200