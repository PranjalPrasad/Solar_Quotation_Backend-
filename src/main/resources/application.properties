spring.application.name=Quotation

# ============================================================
# Solar CRM - Auth Service
# ============================================================

server.port=8091

# ---- MySQL ----
# Create the DB first: CREATE DATABASE solar_crm;
spring.datasource.url=jdbc:mysql://localhost:3306/solar_crm?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Hibernate creates/updates the "users" table automatically from User.java on startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ---- JWT ----
# Demo secret for local/dev testing only - replace with an env-var-backed
# secret (min 256-bit) before any real deployment.
jwt.secret=solar-crm-dev-only-secret-key-please-change-me-before-prod-0123456789
jwt.expiration-ms=21600000

# ---- CORS (frontend served from file:// or a static server during dev) ----
app.cors.allowed-origins=*