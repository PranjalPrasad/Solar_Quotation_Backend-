spring.application.name=Quotation

# Loads secrets/config from a .env file in the working directory (project root).
# "optional:" means the app still starts normally if the file is missing (defaults below are used).
spring.config.import=optional:file:.env[.properties]

# ============================================================
# Solar CRM - Quotation backend
# ============================================================

server.port=8091

# ---- MySQL ----
# The database is created automatically (createDatabaseIfNotExist=true).
spring.datasource.url=jdbc:mysql://localhost:3306/solar_crm?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Hibernate creates and updates the tables from the entities on startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# data.sql seeds roles, modules, permissions, the PLATFORM tenant and the first Super Admin.
# It runs on every start and is written to be idempotent (see the comments inside data.sql).
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ---- JWT ----
# These names are the ones JwtUtil reads (@Value("${sqms.jwt.secret}") and ${sqms.jwt.access-token-minutes}).
# The old jwt.secret / jwt.expiration-ms keys are not read by anything and were removed.
# Set JWT_SECRET in .env (at least 32 characters) in every real environment.
sqms.jwt.secret=${JWT_SECRET:solar-crm-dev-only-secret-key-please-change-me-before-prod-0123456789}
sqms.jwt.access-token-minutes=15
sqms.jwt.refresh-token-days=7
sqms.jwt.refresh-token-days-remember-me=30

# ---- CORS ----
# Comma separated frontend origins, for example http://localhost:5500,http://127.0.0.1:5500
# * is fine for local development only.
app.cors.allowed-origins=*



# ---- Mail (Gmail SMTP shown; any SMTP works) ----
# Gmail: turn on 2-Step Verification, then create an "App password" (Google Account > Security > App passwords)
# and use that 16-character value as MAIL_PASSWORD. Your normal Gmail password will NOT work.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Sender address. With Gmail it must be the same account as MAIL_USERNAME (or a verified alias).
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# Optional: used only when no logo has been uploaded in Settings > Branding. PNG or JPG recommended
# (WebP is not shown by Outlook desktop). Example: ./uploads/branding/logo.png
app.mail.logo-file=

# DEV ONLY: when MAIL_USERNAME is empty, print the reset link in the server log instead of e-mailing it.
# Keep false everywhere else (a reset link is a password).
app.mail.dev-log-link=true

# ---- Password reset ----
# Address of the FRONTEND (where login.html and reset-password.html are served). No trailing slash.
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5501}
app.password-reset.expiry-minutes=30